app = "frea-freelancer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3114"

[http_service]
  internal_port = 3114
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/robots.txt"
    protocol = "http"
    timeout = "5s"

[[mounts]]
  source = "frea_data"
  destination = "/app/data"
  snapshot_retention = 5
